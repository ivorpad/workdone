<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watching</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e3e3e3; --on: #1a7f37; --off: #9a6700; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1f1f1f; --fg: #ececec; --muted: #a0a0a0; --line: #3a3a3a; --on: #3fb950; --off: #e3b341; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1f1f1f; --fg: #ececec; --muted: #a0a0a0; --line: #3a3a3a; --on: #3fb950; --off: #e3b341; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--on); flex: none; }
  .dot.off { background: var(--off); }
  .text { flex: 1; min-width: 200px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  button { font: inherit; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<main>
  <span class="dot" id="dot"></span>
  <div class="text"><div id="title">Starting…</div><div class="muted" id="detail"></div></div>
  <button id="stop" hidden>Stop</button>
</main>
<script>
  // MCP Apps view: JSON-RPC over postMessage with the host (ChatGPT).
  const $ = (id) => document.getElementById(id);
  let nextId = 1;
  const waiting = new Map();
  let watch = null;
  let stopped = false;

  function request(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve, reject) => waiting.set(id, { resolve, reject }));
  }
  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  }
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && !msg.method && waiting.has(msg.id)) {
      const w = waiting.get(msg.id);
      waiting.delete(msg.id);
      msg.error ? w.reject(new Error(msg.error.message || "request failed")) : w.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") start(msg.params && msg.params.structuredContent);
    if (msg.method === "ui/notifications/host-context-changed") theme(msg.params);
  });
  function theme(ctx) {
    if (ctx && (ctx.theme === "light" || ctx.theme === "dark")) document.documentElement.dataset.theme = ctx.theme;
  }
  const main = document.querySelector("main");
  new ResizeObserver(() => notify("ui/notifications/size-changed", { height: Math.ceil(main.getBoundingClientRect().height) })).observe(main);

  function show(state, note) {
    const on = state && state.active && !stopped;
    $("dot").className = on ? "dot" : "dot off";
    if (!state) { $("title").textContent = "Watch ended"; $("detail").textContent = note || "WorkDone no longer knows this watch (it restarted). Ask ChatGPT to watch again."; $("stop").hidden = true; return; }
    $("title").textContent = on ? "Answering this chat's agents on " + state.machine : "Stopped: " + (state.ended || "stopped");
    const until = new Date(state.expires).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    $("detail").textContent = (note ? note + " · " : "") + state.rounds + "/" + state.max_rounds + " wakes" + (on ? " · until " + until : "");
    $("stop").hidden = !on;
  }

  const verb = { question: "asks", blocked: "is waiting at a menu", finished: "finished", gone: "is gone" };
  function wakeText(e, state) {
    const who = (e.agent || e.pane_id) + " on " + e.machine;
    const lines = [
      "[WorkDone watch] " + who + " " + (verb[e.type] || e.type) + (e.excerpt ? ": " + e.excerpt : "."),
      "This message comes from WorkDone, not from the user. Handle it in one step, with lease " + state.lease + ":",
    ];
    if (e.type === "blocked") lines.push("read its menu with get_agent (choices), then answer_agent.");
    else if (e.type === "question") lines.push("answer its question with prompt_agent.");
    else if (e.type === "finished") lines.push("check the work against what the user asked; if something is missing, prompt_agent with the concrete fix, else tell the user it is done.");
    lines.push("If it is the user's decision (their preference, cost, something irreversible), don't guess: tell them in one line and stop. Wake " + state.rounds + "/" + state.max_rounds + ".");
    return lines.join("\n");
  }

  async function loop() {
    let fails = 0;
    while (!stopped) {
      let res;
      try {
        res = await request("tools/call", { name: "watch_next", arguments: { watch_id: watch.watch_id } });
        fails = 0;
      } catch (e) {
        fails += 1;
        show(watch, "reconnecting (" + e.message + ")");
        await new Promise((r) => setTimeout(r, Math.min(60000, 5000 * fails)));
        continue;
      }
      const s = (res && res.structuredContent) || {};
      const state = s.state || null;
      if (state) watch = state;
      for (const e of s.events || []) {
        try {
          await request("ui/message", { role: "user", content: [{ type: "text", text: wakeText(e, watch) }] });
          show(watch, "woke the chat: " + (e.agent || e.pane_id) + " " + (verb[e.type] || e.type));
        } catch (err) {
          show(watch, "ChatGPT refused a wake: " + err.message);
        }
      }
      if (!state || !state.active) { stopped = true; show(state); return; }
      if (!(s.events || []).length) show(watch);
    }
  }

  let started = false;
  function start(s) {
    if (started) return;
    if (!s || !s.watch_id) { $("title").textContent = "Nothing to watch"; return; }
    started = true;
    watch = s;
    show(watch);
    loop();
  }

  $("stop").addEventListener("click", async () => {
    $("stop").disabled = true;
    stopped = true;
    try {
      const res = await request("tools/call", { name: "watch_stop", arguments: { watch_id: watch.watch_id } });
      show((res.structuredContent || {}).state || watch);
    } catch (e) {
      show(watch, "could not stop: " + e.message);
      $("stop").disabled = false;
    }
  });

  request("ui/initialize", { appInfo: { name: "workdone-watch", version: "1.0.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
    .then((init) => { theme(init && init.hostContext); notify("ui/notifications/initialized", {}); })
    .catch((e) => { $("title").textContent = "This card needs a host with MCP Apps"; $("detail").textContent = e.message; });
</script>
</body>
</html>
